    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--text)}

    .toolbar{position:sticky;top:0;z-index:10;background:rgba(246,247,249,.92);backdrop-filter:blur(8px);padding:10px 0;margin-bottom:10px}
    .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    button{border:1px solid var(--border);background:#fff;padding:10px 14px;border-radius:10px;font-size:16px}
    button.primary{background:var(--btn);border-color:var(--btn);color:#fff}
    button.primary:hover{background:var(--btn2);border-color:var(--btn2)}

    .statusline{font-size:13px;color:var(--muted)}
    .grid{display:grid;grid-template-columns:1fr;gap:10px;margin-top:10px}
    @media (min-width:900px){.grid{grid-template-columns: 1fr 1fr}}

    .badge{display:inline-flex;align-items:center;gap:8px;font-weight:800;padding:8px 12px;border-radius:999px;color:#fff}
    .badge.idle{background:#6b7280}
    .badge.ok{background:var(--ok)}
    .badge.ng{background:var(--ng)}
    .badge.warn{background:var(--warn)}

    .kv{border:1px dashed var(--border);border-radius:12px;padding:10px 12px;background:#fafbff}
    .k{font-size:12px;color:var(--muted);margin-bottom:4px}
    .v{font-size:16px;font-weight:700;word-break:break-all}
    .sub{margin-top:6px;font-size:12px;color:var(--muted);white-space:pre-wrap}

    .step{margin-top:10px;padding:12px}
    .step .title{font-size:14px;color:var(--muted);margin-bottom:8px}
    .step .big{font-size:18px;font-weight:800}
    .hint{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.4}

    details{margin-top:10px}
    pre{white-space:pre-wrap;word-break:break-word;font-size:12px;margin:10px 0 0;color:#0a7a33}

    .overlay{
      position:absolute; inset:0; display:flex; flex-direction:column; justify-content:flex-end;
      padding:10px; pointer-events:none;
    }
    .overlay .chip{
      align-self:flex-start; background:rgba(17,17,17,.55); color:#fff; padding:6px 10px; border-radius:999px;
      font-size:12px; font-weight:700;
    }

    .modal-backdrop{
      position:fixed; inset:0; background:rgba(0,0,0,.45); display:none;
      align-items:center; justify-content:center; padding:16px; z-index:9999;
    }
    .modal{
      width:min(520px, 100%); background:#fff; border-radius:14px; border:1px solid var(--border);

    .modal-head{padding:12px 14px; border-bottom:1px solid var(--border); font-weight:800}
    .modal-body{padding:14px}
    .modal-foot{padding:12px 14px; border-top:1px solid var(--border); display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap}
    .modal .muted{color:var(--muted); font-size:13px; margin-top:8px; line-height:1.4}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}

<script>
/** =========================
 *  閰嶇疆
 ========================== */
const API_INSPECTION = "/api/v1/inspection";

/** =========================
 *  鐘舵€佹満
 ========================== */
const S = {
  INIT: "INIT",
  CAMERA_READY: "CAMERA_READY",
  SCANNING: "SCANNING",
  VIN_READY: "VIN_READY",
  COUNTDOWN: "COUNTDOWN",
  RUNNING: "RUNNING",
  DONE: "DONE",
};
let state = S.INIT;

/** =========================
 *  DOM
 ========================== */
const el = {
  video: document.getElementById("video"),
  camChip: document.getElementById("camChip"),
  status: document.getElementById("status"),
  stepText: document.getElementById("stepText"),
  countdownText: document.getElementById("countdownText"),

  vinPreview: document.getElementById("vinPreview"),
  vinInput: document.getElementById("vinInput"),

  btnAllow: document.getElementById("btnAllow"),
  btnScan: document.getElementById("btnScan"),
  btnStart: document.getElementById("btnStart"),
  btnAbort: document.getElementById("btnAbort"),

  log: document.getElementById("log"),

  modalBackdrop: document.getElementById("modalBackdrop"),
  modalVin: document.getElementById("modalVin"),
  modalCancel: document.getElementById("modalCancel"),
  modalOk: document.getElementById("modalOk"),
};

let stream = null;
let scanTimer = null;
let countdownTimer = null;

let scanBusy = false;    // 鉁?闃插苟鍙戦噸鍏ワ紙鎵爜锛?
let pendingVin = "";
let currentVin = "";
let clientEventId = "";
let rearResp = null;
let frontResp = null;

/** =========================
 *  宸ュ叿
 ========================== */
function setStatus(t){ el.status.textContent = "鐘舵€侊細" + t; }
function setStep(t){ el.stepText.textContent = t; }
function log(o){ el.log.textContent = (typeof o==="string") ? o : JSON.stringify(o,null,2); }

function normalizeVin(t){ return (t||"").trim().replace(/\s+/g,""); }
function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

function newEventId(){
  if (crypto && crypto.randomUUID) return crypto.randomUUID();
  return "evt_" + Date.now() + "_" + Math.random().toString(16).slice(2);
}

function applyState(){
  const camOn = !!stream;
  el.btnAllow.disabled = (state !== S.INIT);
  el.btnScan.disabled  = !(state === S.CAMERA_READY || state === S.VIN_READY);
  el.btnStart.disabled = !(state === S.VIN_READY);
  el.btnAbort.disabled = (state === S.INIT);
  if (!camOn) el.camChip.textContent = "CAM锛氭湭寮€鍚?;
}

async function waitVideoReady(video, timeoutMs = 3500){
  const start = Date.now();
  try { await video.play(); } catch(e) {}
  while ((video.videoWidth === 0 || video.videoHeight === 0) && Date.now()-start < timeoutMs){
    await sleep(50);
  }
  if (video.videoWidth === 0) throw new Error("瑙嗛鐢婚潰灏氭湭灏辩华锛堝彲鑳芥潈闄?HTTPS/娴忚鍣ㄩ檺鍒讹級");
}

/** =========================
 *  鎽勫儚澶存帶鍒?
 ========================== */
async function stopStream(){
  if (stream){
    stream.getTracks().forEach(t=>t.stop());
    stream = null;
  }
  el.video.srcObject = null;
  el.camChip.textContent = "CAM锛氭湭寮€鍚?;
}

async function openCamera(facingMode /* 'environment'|'user' */){
  if (!window.isSecureContext){
    throw new Error("闇€瑕?HTTPS 鎵嶈兘鍦ㄦ墜鏈虹鍚敤鎽勫儚澶达紙褰撳墠闈炲畨鍏ㄤ笂涓嬫枃锛?);
  }
  if (!navigator.mediaDevices?.getUserMedia){
    throw new Error("娴忚鍣ㄤ笉鏀寔 getUserMedia锛堝缓璁娇鐢ㄧ郴缁?Safari/Chrome锛?);
  }

  await stopStream();
  await sleep(250); // 鉁?iOS 閲婃斁纭欢缂撳啿锛堟洿绋筹級

  const constraints = {
    video: { facingMode, width:{ideal:1920}, height:{ideal:1080} }, // 鉁?1D 鏉＄爜鏇撮渶瑕佸儚绱?
    audio: false
  };

  stream = await navigator.mediaDevices.getUserMedia(constraints);
  el.video.srcObject = stream;
  await waitVideoReady(el.video, 3500);

  el.camChip.textContent = "CAM锛? + (facingMode === "environment" ? "鍚庣疆" : "鍓嶇疆");
}

/** =========================
 *  鎷嶇収
 ========================== */
async function captureJpegBlob(){
  await waitVideoReady(el.video, 3500);
  const canvas = document.createElement("canvas");
  canvas.width = el.video.videoWidth;
  canvas.height = el.video.videoHeight;
  canvas.getContext("2d").drawImage(el.video, 0, 0);
  return await new Promise((resolve,reject)=>{
    canvas.toBlob(b=> b ? resolve(b) : reject(new Error("toBlob 澶辫触")), "image/jpeg", 0.85);
  });
}

/** =========================
 *  璋冪敤鍚庣
 ========================== */
async function postInspection({vin, blob, client_event_id, camera}){
  const fd = new FormData();
  fd.append("vin", vin);
  fd.append("client_event_id", client_event_id);
  fd.append("camera", camera);
  fd.append("image", blob, `${camera}.jpg`);

  const r = await fetch(API_INSPECTION, { method:"POST", body: fd });
  const ct = (r.headers.get("content-type")||"").toLowerCase();
  const text = await r.text();

  if (!ct.includes("application/json")){
    log(`鏈嶅姟绔湭杩斿洖JSON锛孒TTP=${r.status}\n\n${text.slice(0, 1500)}`);
    throw new Error(`鏈嶅姟绔湭杩斿洖JSON锛孒TTP=${r.status}`);
  }
  return JSON.parse(text);
}

/** =========================
 *  鍙岀粨鏋滄覆鏌?
 ========================== */
function setBadgeById(prefix, kind, text){
  const b = document.getElementById(prefix + "overallBadge");
  b.className = "badge " + kind;
  b.textContent = text;
}

function renderResult(resp, prefix){
  const data = resp?.data || null;

  if (!data){
    setBadgeById(prefix, "warn", (prefix==="rear_"?"鍚庣疆":"鍓嶇疆") + "锛氭棤缁撴灉");
    document.getElementById(prefix+"summaryLine").textContent = "鏈嶅姟绔繑鍥炵己灏?data";
    return;
  }

  const overall = (data.overall || "").toUpperCase();
  const head = (prefix==="rear_") ? "鍚庣疆" : "鍓嶇疆";

  if (overall === "OK") setBadgeById(prefix, "ok", `${head}锛歄K`);
  else if (overall === "NG") setBadgeById(prefix, "ng", `${head}锛歂G`);
  else setBadgeById(prefix, "warn", `${head}锛?{overall || "鏈煡"}`);

  document.getElementById(prefix+"recordId").textContent = data.record_id ?? "-";
  document.getElementById(prefix+"eventId").textContent  = data.client_event_id ?? "-";
  document.getElementById(prefix+"imgPath").textContent  = data.image_path ?? "-";
  document.getElementById(prefix+"idemHit").textContent  = "骞傜瓑鍛戒腑锛? + (data.idempotent_hit ? "鏄? : "鍚?);

  const std = (((data.standard||{}).features||{}).door_trim_color) ?? null;
  const det = ((data.detected||{}).door_trim_color) ?? null;
  document.getElementById(prefix+"doorResult").textContent = `鏍囧噯锛?{std ?? "-"} 锝?璇嗗埆锛?{det ?? "-"}`;

  const cr = (data.compare_result||{}).door_trim_color;
  if (cr && typeof cr === "object"){
    document.getElementById(prefix+"doorDetail").textContent =
      `缁撹锛?{cr.result ?? "-"}\nmandatory锛?{cr.mandatory ?? "-"}\nreason锛?{cr.reason ?? "-"}`;
  } else {
    document.getElementById(prefix+"doorDetail").textContent = cr ?? "-";
  }

  const meta = (((data.detected||{})._meta||{}).door_trim_color) || {};
  const conf = meta.conf != null ? Number(meta.conf).toFixed(3) : "-";
  const dist = meta.selected_dist != null ? Number(meta.selected_dist).toFixed(2) : "-";
  const thr  = meta.threshold != null ? Number(meta.threshold).toFixed(2) : "-";

  document.getElementById(prefix+"scoreLine").textContent = `YOLO conf锛?{conf}`;
  document.getElementById(prefix+"distLine").textContent  = `dist锛?{dist} 锝?threshold锛?{thr}`;
  document.getElementById(prefix+"summaryLine").textContent =
    `VIN=${data.vin ?? "-"} 锝?overall=${overall || "-"} 锝?trace=${resp.trace_id ?? "-"}`;
}

function resetCards(){
  setBadgeById("rear_", "idle", "鍚庣疆锛氱瓑寰呮娴?);
  setBadgeById("front_", "idle", "鍓嶇疆锛氱瓑寰呮娴?);

  const ids = [
    "rear_recordId","rear_eventId","rear_doorResult","rear_doorDetail","rear_imgPath","rear_idemHit","rear_scoreLine","rear_distLine","rear_summaryLine",
    "front_recordId","front_eventId","front_doorResult","front_doorDetail","front_imgPath","front_idemHit","front_scoreLine","front_distLine","front_summaryLine",
  ];
  for (const id of ids){
    const node = document.getElementById(id);
    if (node) node.textContent = "-";
  }
}

/** =========================
 *  ZXing 鎵爜锛?D 鏉＄爜锛氬璺緞灏濊瘯 + 鏇寸ǔ鐨?ROI锛?
 *  鍏抽敭鏀瑰姩锛?
 *   - 涓嶅啀闄愬埗 POSSIBLE_FORMATS锛堝厛淇濊瘉鑳借瘑鍒級
 *   - 涓嶅仛鍥哄畾闃堝€间簩鍊煎寲锛堝彧鐏板害锛岄伩鍏嶆潯绾规柇瑁傦級
 *   - 1甯у唴澶氳矾寰勶細鐏板害ROI -> 褰╄壊ROI -> 鐏板害鍏ㄧ敾闈?
 *   - Reader 鍗曚緥
 ========================== */
const scanCanvas = document.createElement("canvas");
const scanCtx = scanCanvas.getContext("2d", { willReadFrequently:true });

let ZXING_READER = null;

function initZXingOnce(){
  if (ZXING_READER) return;
  if (typeof ZXing === "undefined"){
    throw new Error("ZXing 鏈姞杞斤細璇风‘璁?static/zxing/zxing.min.js 宸叉纭儴缃插苟鍙闂?);
  }
  const hints = new Map();
  hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
  hints.set(ZXing.DecodeHintType.ALSO_INVERTED, true);
  // 鉂椾笉璁剧疆 POSSIBLE_FORMATS锛氶伩鍏嶆潯鐮佹牸寮忎笉鍦ㄥ垪琛ㄥ鑷存案杩滆瘑鍒笉鍒?
  ZXING_READER = new ZXing.BrowserMultiFormatReader(hints);
}

// 鉁?灞呬腑 ROI锛堟洿绗﹀悎鎵嬫満鎵爜锛?
function getROI(video){
  const vw = video.videoWidth, vh = video.videoHeight;
  const w = Math.floor(vw * 0.80);
  const h = Math.floor(vh * 0.45);
  const x = Math.floor((vw - w) / 2);
  const y = Math.floor((vh - h) / 2);
  return {x, y, w, h};
}

// 鉁?鍙伆搴︼紝涓嶅仛纭槇鍊间簩鍊煎寲
function preprocessToBW(imgData){
  const d = imgData.data;
  for(let i=0;i<d.length;i+=4){
    const g = (d[i]*0.299 + d[i+1]*0.587 + d[i+2]*0.114)|0;
    d[i]=d[i+1]=d[i+2]=g;
  }
  return imgData;
}

async function scanOnce(){
  initZXingOnce();
  await waitVideoReady(el.video, 3500);

  const buildCanvas = (roi, scale, doGray) => {
    scanCanvas.width = Math.floor(roi.w * scale);
    scanCanvas.height = Math.floor(roi.h * scale);

    scanCtx.drawImage(
      el.video,
      roi.x, roi.y, roi.w, roi.h,
      0, 0, scanCanvas.width, scanCanvas.height
    );

    if (doGray){
      let imgData = scanCtx.getImageData(0,0,scanCanvas.width,scanCanvas.height);
      imgData = preprocessToBW(imgData);
      scanCtx.putImageData(imgData,0,0);
    }
    return scanCanvas;
  };

  const tryDecode = async (canvas) => {
    try{
      if (typeof ZXING_READER.decodeFromCanvas === "function"){
        const r = await ZXING_READER.decodeFromCanvas(canvas);
        return r ? r.text : "";
      }
      const img = document.createElement("img");
      img.src = canvas.toDataURL("image/png");
      await new Promise((res,rej)=>{ img.onload=res; img.onerror=()=>rej(new Error("img load fail")); });
      const r = await ZXING_READER.decodeFromImageElement(img);
      return r ? r.text : "";
    }catch(e){
      return "";
    }
  };

  // 1) 鐏板害灞呬腑 ROI锛堟渶绋筹級
  const roi = getROI(el.video);
  let out = await tryDecode(buildCanvas(roi, 2.0, true));
  if (out) return out;

  // 2) 褰╄壊灞呬腑 ROI锛堟煇浜涙墦鍗?鍙嶅厜鎯呭喌涓嬫洿寮猴級
  out = await tryDecode(buildCanvas(roi, 2.0, false));
  if (out) return out;

  // 3) 鐏板害鍏ㄧ敾闈紙鎺掗櫎 ROI 涓嶅锛?
  const full = {x:0, y:0, w:el.video.videoWidth, h:el.video.videoHeight};
  out = await tryDecode(buildCanvas(full, 1.0, true));
  if (out) return out;

  return "";
}

function stopScan(){
  if (scanTimer){ clearInterval(scanTimer); scanTimer=null; }
  scanBusy = false;
}

function showVinConfirmModal(vin){
  el.modalVin.textContent = vin;
  el.modalBackdrop.style.display = "flex";
}
function hideVinConfirmModal(){
  el.modalBackdrop.style.display = "none";
}

function startScanLoop(){
  stopScan();

  const start = Date.now();
  const maxMs = 12000; // 鉁?绋嶅井寤堕暱锛屾彁楂樺懡涓巼锛堝彲鎸夐渶璋冿級

  scanTimer = setInterval(async ()=>{
    if (state !== S.SCANNING) return;
    if (scanBusy) return;
    scanBusy = true;

    try{
      const txt = await scanOnce();
      const vin = normalizeVin(txt);

      if (vin){
        stopScan();
        pendingVin = vin;
        el.vinPreview.textContent = pendingVin;
        el.vinInput.value = pendingVin;

        setStep("宸茶瘑鍒?VIN锛堢瓑寰呭脊绐楃‘璁わ級");
        setStatus("VIN 宸茶瘑鍒紝绛夊緟纭");
        showVinConfirmModal(pendingVin);
        return;
      }

      if (Date.now()-start > maxMs){
        stopScan();
        state = S.CAMERA_READY;
        setStep("鎵爜瓒呮椂锛堝彲閲嶈瘯鎴栨墜鍔ㄨ緭鍏?VIN锛?);
        setStatus("鎵爜瓒呮椂");
        applyState();
      }
    } finally {
      scanBusy = false;
    }
  }, 180);
}

/** =========================
 *  鍊掕鏃?+ 鍙岀浉鏈鸿嚜鍔ㄦ媿鎽?
 ========================== */
function stopCountdown(){
  if (countdownTimer){ clearInterval(countdownTimer); countdownTimer=null; }
}

async function runCountdown(seconds){
  stopCountdown();
  state = S.COUNTDOWN;
  applyState();

  let left = seconds;
  el.countdownText.textContent = `${left}s`;
  setStep(`鍊掕鏃?${left}s 鍚庤嚜鍔ㄦ媿鎽勶紙鍚庣疆鈫掑墠缃級`);
  setStatus(`鍊掕鏃朵腑 ${left}s`);

  await new Promise((resolve)=>{
    countdownTimer = setInterval(()=>{
      left -= 1;
      el.countdownText.textContent = `${Math.max(left,0)}s`;
      setStatus(`鍊掕鏃朵腑 ${Math.max(left,0)}s`);
      if (left <= 0){
        stopCountdown();
        resolve();
      }
    }, 1000);
  });
}

async function runAutoFlow(){
  if (!currentVin){
    alert("VIN 涓虹┖锛氳鎵爜鎴栨墜鍔ㄨ緭鍏ュ悗鍐嶅紑濮?);
    return;
  }

  resetCards();
  log("");

  clientEventId = newEventId(); // flow id
  const rearEventId = `${clientEventId}_rear`;
  const frontEventId = `${clientEventId}_front`;
  rearResp = null;
  frontResp = null;

  state = S.RUNNING;
  applyState();

  try{
    await runCountdown(10);

    setStep("鑷姩鎷嶆憚锛氬悗缃憚鍍忓ご");
    setStatus("鍚庣疆鎷嶆憚涓€?);
    await openCamera("environment");
    const rearBlob = await captureJpegBlob();

    setStatus("鍚庣疆鎻愪氦妫€娴嬩腑鈥?);
    rearResp = await postInspection({ vin: currentVin, blob: rearBlob, client_event_id: rearEventId, camera:"rear" });
    renderResult(rearResp, "rear_");

    setStep("鑷姩鎷嶆憚锛氬墠缃憚鍍忓ご");
    setStatus("鍓嶇疆鎷嶆憚涓€?);
    await openCamera("user");
    const frontBlob = await captureJpegBlob();

    setStatus("鍓嶇疆鎻愪氦妫€娴嬩腑鈥?);
    frontResp = await postInspection({ vin: currentVin, blob: frontBlob, client_event_id: frontEventId, camera:"front" });
    renderResult(frontResp, "front_");

    setStep("妫€娴嬪畬鎴愶紙宸插睍绀哄悗缃?鍓嶇疆缁撴灉锛?);
    setStatus("妫€娴嬪畬鎴?);
    state = S.DONE;
    applyState();

    log({
      vin: currentVin,
      flow_event_id: clientEventId,
      rear_event_id: rearEventId,
      front_event_id: frontEventId,
      rear: rearResp,
      front: frontResp
    });

  } catch (err){
    setStep("娴佺▼澶辫触锛堝凡涓锛?);
    setStatus("娴佺▼澶辫触");
    log("娴佺▼澶辫触锛? + (err?.message || String(err)));
    alert("娴佺▼澶辫触锛? + (err?.message || String(err)));
    state = S.CAMERA_READY;
    applyState();
  } finally {
    // 鉁?鑷姩鍏抽棴鎽勫儚澶达紙鎴愬姛/澶辫触閮藉叧锛?
    await stopStream();
    el.countdownText.textContent = "-";
  }
}

el.btnScan.onclick = ()=>{
  if (!stream){ alert("璇峰厛鍏佽鎽勫儚澶?); return; }
  pendingVin = "";
  setStep("鎵爜涓紙鍛戒腑鍚庡脊绐楃‘璁わ級");
  setStatus("鎵爜涓€?);
  el.vinPreview.textContent = "鎵爜涓€?;

  state = S.SCANNING;
  applyState();
  startScanLoop();
};

el.btnStart.onclick = async ()=>{
  const vin = normalizeVin(el.vinInput.value || currentVin);
  if (!vin){ alert("VIN 涓虹┖锛氳鎵爜鎴栨墜鍔ㄨ緭鍏?); return; }
  currentVin = vin;
  el.vinPreview.textContent = currentVin;

  state = S.VIN_READY;
  applyState();

  await runAutoFlow();
};

el.btnAbort.onclick = async ()=>{
  stopScan();
  stopCountdown();
  hideVinConfirmModal();

  pendingVin = "";
  currentVin = "";
  clientEventId = "";
  rearResp = null;
  frontResp = null;

  await stopStream();

  el.vinPreview.textContent = "锛堟湭璇嗗埆锛?;
  el.vinInput.value = "";
  el.countdownText.textContent = "-";
  resetCards();
  log("");

  state = S.INIT;
  setStep("绛夊緟寮€濮?);
  setStatus("宸查噸缃?);
  applyState();
};

el.vinInput.addEventListener("keydown", (e)=>{
  if (e.key === "Enter"){
    const vin = normalizeVin(el.vinInput.value);
    if (!vin) return;
    currentVin = vin;
    el.vinPreview.textContent = currentVin;
    state = stream ? S.VIN_READY : S.INIT;
    setStep(stream ? "VIN 宸茶緭鍏ワ細鍙紑濮嬭嚜鍔ㄦ媿鎽? : "璇峰厛鍏佽鎽勫儚澶?);
    setStatus(stream ? "VIN 宸插氨缁? : "鏈惎鍔?);
    applyState();
  }
});

el.modalCancel.onclick = ()=>{
  hideVinConfirmModal();
  if (stream){
    state = S.SCANNING;
    setStep("缁х画鎵爜涓紙鍛戒腑鍚庡脊绐楃‘璁わ級");
    setStatus("鎵爜涓€?);
    applyState();
    startScanLoop();
  } else {
    state = S.INIT;
    applyState();
  }
};

el.modalOk.onclick = async ()=>{
  hideVinConfirmModal();

  currentVin = normalizeVin(pendingVin || el.vinInput.value);
  if (!currentVin){
    alert("VIN 涓虹┖锛屾棤娉曞紑濮?);
    if (stream){
      state = S.SCANNING; applyState(); startScanLoop();
    }
    return;
  }

  el.vinPreview.textContent = currentVin;
  el.vinInput.value = currentVin;

  state = S.VIN_READY;
  setStep("VIN 宸茬‘璁わ細鍗冲皢杩涘叆 10s 鍊掕鏃?);

  applyState();

  await runAutoFlow();
};

el.modalBackdrop.addEventListener("click", (e)=>{

    el.modalCancel.click();
  }
});

</script>
